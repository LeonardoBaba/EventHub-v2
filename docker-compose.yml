version: '3.8'

services:
  eventhub-api:
    build:
      context: .
      dockerfile: eventhub-api/Dockerfile
    image: eventhub-api-v2:latest
    container_name: eventhub-api-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://db:5432/eventhubdb
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - eventhub-net
      - proxy-net

  eventhub-payments:
    build:
      context: .
      dockerfile: eventHub-payments/Dockerfile
    image: eventhub-payments-v2:latest
    container_name: eventhub-payments-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/eventhub-payments?authSource=admin
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PAYMENTS_SERVER_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - eventhub-net

  db:
    image: postgres:16-alpine
    container_name: eventhub-db-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=eventhubdb
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=eventhub-payments
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - eventhub-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eventhub-rabbitmq-v2
    restart: unless-stopped
    ports:
      - "15672:15672"
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - eventhub-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: eventhub-prometheus
    restart: unless-stopped
    environment:
      - MONITORING_PASSWORD=${MONITORING_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$$MONITORING_PASSWORD" > /tmp/monitoring_password
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - eventhub-net

  grafana:
    image: grafana/grafana:10.4.5
    container_name: eventhub-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - eventhub-net
      - proxy-net

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  eventhub-net:
  proxy-net:
    external: true