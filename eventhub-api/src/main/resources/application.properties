spring.application.name=EventHub
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
server.port=${API_SERVER_PORT}
api.secret.security.secret=${JWT_SECRET}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
frontend.url=${FRONTEND_URL:http://localhost:3000}
admin.credentials=${ADMIN_CREDENTIALS:}
admin.email=${ADMIN_EMAIL:}
admin.cpf=${ADMIN_CPF:}
mq.dlx.name=${MQ_DLX_NAME:eventhub.dlx}
ratelimit.requests-per-minute=${RATELIMIT_RPM:10}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}