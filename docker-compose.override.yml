# Dev-only overrides, auto-loaded by `docker compose up`.
services:
  eventhub-api:
    ports:
      - "${API_PORT}:${API_PORT}"

  eventhub-payments:
    ports:
      - "${PAYMENTS_PORT}:${PAYMENTS_PORT}"

  prometheus:
    ports:
      - "9090:9090"

# Make proxy-net a locally-created network in dev instead of requiring a
networks:
  proxy-net:
    external: false
