# Dev-only overrides, auto-loaded by `docker compose up`.
services:
  eventhub-api:
    ports:
      - "${API_SERVER_PORT}:${API_SERVER_PORT}"

  eventhub-payments:
    ports:
      - "${PAYMENTS_SERVER_PORT}:${PAYMENTS_SERVER_PORT}"

  prometheus:
    ports:
      - "9090:9090"

# Make proxy-net a locally-created network in dev instead of requiring a
networks:
  proxy-net:
    external: false
